<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Les Geeks du VR</title>
  <link rel="icon" type="image/png" href="/static/logos/geeks-du-vr.png" />
  <link rel="stylesheet" href="/static/css/main.css?v=11" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="login-body">

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      <span class="logo-geeks logo-geeks-light" aria-label="Les Geeks du VR"><span class="l1">Les Geeks</span><span class="l2">du</span><span class="l3">VR</span></span>
    </div>

    <p class="login-subtitle">Descriptions et évaluation de prix pour concessions de VR</p>

    {% if error %}
    <div class="alert alert-error">
      <i class="fa fa-circle-exclamation"></i>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">Nom d'utilisateur</label>
        <input class="form-control" type="text" id="username" name="username"
               placeholder="Entrez votre nom d'utilisateur" autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input class="form-control" type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="app_password">Mot de passe de l'application</label>
        <input class="form-control" type="password" id="app_password" name="app_password"
               placeholder="Mot de passe partagé" autocomplete="off" required />
        <p class="form-hint">Mot de passe commun de l'application (fourni par votre gestionnaire).</p>
      </div>
      <div class="form-group" style="margin-bottom:8px;">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.92rem;color:var(--text-muted);">
          <input type="checkbox" name="remember_me" value="1"
                 style="width:16px;height:16px;cursor:pointer;accent-color:var(--accent);" />
          Se souvenir de moi (30 jours)
        </label>
      </div>
      <button type="submit" class="btn-primary btn-lg w-full" style="justify-content:center; margin-top:8px;">
        <i class="fa fa-right-to-bracket"></i>
        Se connecter
      </button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:0.88rem;">
      Pas encore de compte ? <a href="/register" style="font-weight:600;">Créer un compte</a>
    </p>

    <div class="login-footer">
      <span>Concession</span>
      <img src="/static/logos/vr-thetford.png" alt="VR Thetford" style="max-height:26px;object-fit:contain;">
    </div>
  </div>
</div>

</body>
</html>
