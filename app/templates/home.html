<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Les Geeks du VR — Outil pour concessions de VR</title>
  <link rel="stylesheet" href="/static/css/main.css?v=9" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="home-body">

  <!-- FOND PREMIUM -->
  <div class="hero-bg"></div>

  <!-- LOGO VR THETFORD en filigrane fond -->
  <div class="home-dealer-backdrop">
    <img src="/static/logos/vr-thetford.png" alt="" class="backdrop-logo">
  </div>

  <!-- CARTE CENTRALE -->
  <div class="home-center">
    <div class="home-card">

      <!-- Logo original Les Geeks du VR -->
      <img src="/static/logos/geeks-du-vr.png" alt="Les Geeks du VR" class="home-descrigeek-logo">

      <p class="home-subtitle">Descriptions et évaluation de prix<br>pour concessions de véhicules récréatifs</p>

      <!-- Séparateur avec logo VR Thetford -->
      <div class="home-dealer-strip">
        <img src="/static/logos/vr-thetford.png" alt="VR Thetford" class="home-vr-logo">
      </div>

      <a href="/login" class="btn-primary btn-lg home-login-btn">
        <i class="fa fa-right-to-bracket"></i>
        Se connecter
      </a>
    </div>
  </div>

  <!-- PIED DE PAGE -->
  <footer class="home-footer">
    <img src="/static/logos/geeks-du-vr.png" alt="Les Geeks du VR" class="home-footer-logo">
    <span class="home-footer-text">Outil pour concessions de VR</span>
  </footer>

</body>
</html>
