<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créer un compte — Les Geeks du VR</title>
  <link rel="stylesheet" href="/static/css/main.css?v=9" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="login-body">

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      <img src="/static/logos/lesgeeksduvr-onlight.svg" alt="Les Geeks du VR" style="max-height:52px;object-fit:contain;">
    </div>

    <p class="login-subtitle">Créez votre compte pour accéder à l'application</p>

    {% if error %}
    <div class="alert alert-error">
      <i class="fa fa-circle-exclamation"></i>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/register">
      <div class="form-group">
        <label class="form-label" for="full_name">Nom complet</label>
        <input class="form-control" type="text" id="full_name" name="full_name"
               value="{{ form.full_name if form else '' }}" placeholder="Jean Dupont" autofocus />
      </div>
      <div class="form-group">
        <label class="form-label" for="username">Nom d'utilisateur *</label>
        <input class="form-control" type="text" id="username" name="username"
               value="{{ form.username if form else '' }}" placeholder="jdupont"
               autocomplete="username" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Courriel</label>
        <input class="form-control" type="email" id="email" name="email"
               value="{{ form.email if form else '' }}" placeholder="jdupont@exemple.com" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mot de passe personnel *</label>
        <input class="form-control" type="password" id="password" name="password"
               placeholder="Minimum 6 caractères" autocomplete="new-password" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password2">Confirmer le mot de passe *</label>
        <input class="form-control" type="password" id="password2" name="password2"
               placeholder="••••••••" autocomplete="new-password" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="app_password">Mot de passe de l'application *</label>
        <input class="form-control" type="password" id="app_password" name="app_password"
               placeholder="Mot de passe partagé" autocomplete="off" required />
        <p class="form-hint">Mot de passe commun fourni par votre gestionnaire.</p>
      </div>
      <button type="submit" class="btn-primary btn-lg w-full" style="justify-content:center; margin-top:8px;">
        <i class="fa fa-user-plus"></i>
        Créer mon compte
      </button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:0.88rem;">
      Déjà un compte ? <a href="/login" style="font-weight:600;">Se connecter</a>
    </p>
  </div>
</div>

</body>
</html>
